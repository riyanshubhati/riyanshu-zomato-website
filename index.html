<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Order food online</title>
    <style>
        /* =========================
   RESET
========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #222;
        }


        /* =========================
   HEADER
========================= */

        header {
            width: 100%;
            height: 80px;

            position: absolute;
            top: 0;
            left: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 8%;

            z-index: 10;

            background: linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.55),
                    transparent);
        }

        /* Logo */

        .logo img {
            width: 145px;
            display: block;
        }

        /* Navigation */

        header ul {
            display: flex;
            align-items: center;
            gap: 35px;

            list-style: none;
        }

        header ul li a {
            color: white;
            text-decoration: none;

            font-size: 16px;
            font-weight: 500;

            transition: 0.3s ease;
        }

        header ul li a:hover {
            color: #ffb3b3;
        }


        /* =========================
   HERO
========================= */

        .hero {
            position: relative;

            width: 100%;
            height: 680px;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background image */

        .hero-bg {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;

            top: 0;
            left: 0;

            z-index: 0;

            transform: scale(1.02);

            filter: brightness(0.65);
        }

        /* Dark gradient */

        .hero::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(180deg,
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.15) 40%,
                    rgba(0, 0, 0, 0.65));

            z-index: 1;
        }


        /* =========================
   HERO CONTENT
========================= */

        .hero-content {
            position: relative;

            z-index: 2;

            width: 100%;
            max-width: 900px;

            padding: 40px;

            text-align: center;

            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Small top text */

        .hero-content::before {
            content: "WELCOME TO ZOMATO";

            font-size: 14px;
            letter-spacing: 4px;
            font-weight: bold;

            margin-bottom: 18px;

            opacity: 0.9;
        }


        /* Main heading */

        .hero-content h1 {
            font-size: 62px;
            line-height: 1.05;

            max-width: 800px;

            margin-bottom: 22px;

            font-weight: 800;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.4);
        }


        /* Description */

        .hero-content p {
            font-size: 20px;
            line-height: 1.6;

            max-width: 600px;

            margin-bottom: 35px;

            color: rgba(255, 255, 255, 0.9);
        }


        /* =========================
   SEARCH BOX
========================= */

        .hero-content input {
            width: 600px;
            max-width: 90%;

            height: 62px;

            padding: 0 25px;

            border: none;
            border-radius: 14px;

            outline: none;

            background: rgba(255, 255, 255, 0.97);

            color: #222;

            font-size: 17px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);

            transition: 0.3s ease;
        }

        .hero-content input::placeholder {
            color: #777;
        }

        .hero-content input:focus {
            transform: translateY(-3px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }


        /* =========================
   FOOTER
========================= */

        footer {
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #181818;

            color: #aaa;

            font-size: 14px;

            letter-spacing: 0.5px;
        }


        /* =========================
   RESPONSIVE
========================= */

        @media (max-width: 900px) {

            header {
                padding: 0 5%;
            }

            header ul {
                gap: 18px;
            }

            header ul li a {
                font-size: 14px;
            }

            .hero-content h1 {
                font-size: 48px;
            }

            .hero-content p {
                font-size: 18px;
            }
        }


        @media (max-width: 600px) {

            header {
                height: 70px;
            }

            .logo img {
                width: 110px;
            }

            header ul {
                gap: 10px;
            }

            header ul li a {
                font-size: 11px;
            }

            .hero {
                height: 600px;
            }

            .hero-content {
                padding: 20px;
            }

            .hero-content::before {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .hero-content h1 {
                font-size: 38px;
            }

            .hero-content p {
                font-size: 16px;
            }

            .hero-content input {
                height: 55px;
                font-size: 14px;
                border-radius: 10px;
            }

            footer {
                height: 65px;
                font-size: 12px;
            }
        }

        /* =========================
   ANIMATIONS
========================= */

        /* Header comes down */

        header {
            animation: headerDown 1s ease forwards;
        }

        @keyframes headerDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Logo floating */

        .logo img {
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

            100% {
                transform: translateY(0);
            }
        }


        /* Navigation links */

        header ul li {
            opacity: 0;
            animation: navAppear 0.7s ease forwards;
        }

        header ul li:nth-child(1) {
            animation-delay: 0.2s;
        }

        header ul li:nth-child(2) {
            animation-delay: 0.35s;
        }

        header ul li:nth-child(3) {
            animation-delay: 0.5s;
        }

        header ul li:nth-child(4) {
            animation-delay: 0.65s;
        }

        @keyframes navAppear {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Background zoom */

        .hero-bg {
            animation: backgroundZoom 10s ease-in-out infinite alternate;
        }

        @keyframes backgroundZoom {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.08);
            }
        }


        /* Hero heading */

        .hero-content h1 {
            opacity: 0;
            animation: headingAppear 1s ease 0.4s forwards;
        }

        @keyframes headingAppear {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Welcome text */

        .hero-content::before {
            opacity: 0;
            animation: welcomeAppear 1s ease 0.2s forwards;
        }

        @keyframes welcomeAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
                letter-spacing: 10px;
            }

            to {
                opacity: 0.9;
                transform: translateY(0);
                letter-spacing: 4px;
            }
        }


        /* Description */

        .hero-content p {
            opacity: 0;
            animation: textAppear 1s ease 0.7s forwards;
        }

        @keyframes textAppear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Search box */

        .hero-content input {
            opacity: 0;
            animation:
                searchAppear 1s ease 1s forwards,
                searchGlow 3s ease-in-out 2s infinite;
        }

        @keyframes searchAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* Search box glow */

        @keyframes searchGlow {
            0% {
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            }

            50% {
                box-shadow: 0 15px 45px rgba(255, 255, 255, 0.35);
            }

            100% {
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            }
        }


        /* Search hover */

        .hero-content input:hover {
            transform: scale(1.02);
        }


        /* Navigation hover */

        header ul li a {
            position: relative;
        }

        header ul li a::after {
            content: "";

            position: absolute;

            width: 0;
            height: 2px;

            bottom: -7px;
            left: 50%;

            background: white;

            transition: all 0.3s ease;
        }

        header ul li a:hover::after {
            width: 100%;
            left: 0;
        }


        /* Footer */

        footer {
            animation: footerAppear 1s ease forwards;
        }

        @keyframes footerAppear {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
