<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Riyanshu Zomato</title>

    <style>
        /* ---------- BASIC RESET ---------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #e23744;
            overflow: hidden;
        }


        /* ---------- HERO SECTION ---------- */

        .hero {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background: #e23744;
        }


        /* ---------- BACKGROUND IMAGE ---------- */

        .hero-bg {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            z-index: 1;

            /* Slow background animation */
            animation: backgroundZoom 10s ease-in-out infinite alternate;
        }


        @keyframes backgroundZoom {

            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.08);
            }

        }


        /* ---------- CONTENT ---------- */

        .hero-content {
            position: relative;

            z-index: 2;

            width: 90%;

            text-align: center;

            color: white;
        }


        /* ---------- HEADING ---------- */

        .hero-content h1 {
            font-size: 55px;

            margin-bottom: 15px;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.5);

            animation: headingAnimation 1s ease forwards;
        }


        @keyframes headingAnimation {

            0% {
                opacity: 0;
                transform: translateY(-50px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ---------- PARAGRAPH ---------- */

        .hero-content p {
            font-size: 20px;

            margin-bottom: 30px;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.5);

            animation: paragraphAnimation 1.5s ease forwards;
        }


        @keyframes paragraphAnimation {

            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }

        }


        /* ---------- SEARCH BOX ---------- */

        .search-box {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 10px;

            width: 650px;

            max-width: 100%;

            margin: auto;

            animation: searchAnimation 1.5s ease forwards;
        }


        @keyframes searchAnimation {

            0% {
                opacity: 0;
                transform: translateY(50px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ---------- SEARCH INPUT ---------- */

        .search-box input {
            width: 100%;

            height: 60px;

            padding: 0 22px;

            border: none;

            outline: none;

            border-radius: 12px;

            background: white;

            color: #222;

            font-size: 17px;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        /* Input focus animation */

        .search-box input:focus {
            transform: scale(1.02);

            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.8);
        }


        /* ---------- SEARCH BUTTON ---------- */

        .search-box button {
            height: 60px;

            padding: 0 28px;

            border: none;

            border-radius: 12px;

            background: #e23744;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }


        /* Button hover animation */

        .search-box button:hover {
            transform: scale(1.08);

            background: #c91f2d;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3);
        }


        /* Button click animation */

        .search-box button:active {
            transform: scale(0.95);
        }


        /* ---------- MOBILE RESPONSIVE ---------- */

        @media (max-width: 600px) {

            .hero-content h1 {
                font-size: 35px;
            }

            .hero-content p {
                font-size: 16px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input {
                width: 100%;
            }

            .search-box button {
                width: 100%;
            }

        }

    </style>
</head>


<body>


    <!-- ================= HERO ================= -->

    <section class="hero">


        <!-- BACKGROUND IMAGE -->

        <img
            class="hero-bg"
            src="rubaitul-azad-N0gLp-w6zF4-unsplash.jpg"
            alt="Zomato Background"
        >


        <!-- ================= CONTENT ================= -->

        <div class="hero-content">


            <!-- HEADING -->

            <h1>
                Welcome to my website
            </h1>


            <!-- DESCRIPTION -->

            <p>
                Hi, I'm Riyanshu Bhati — Developer, Learner & Creator.
            </p>


            <!-- ================= SEARCH ================= -->

            <div class="search-box">


                <input
                    type="text"
                    id="search"
                    placeholder="Search for food, restaurants or grocery"
                >


                <button onclick="searchZomato()">
                    Search
                </button>


            </div>


        </div>


    </section>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ---------- ZOMATO SEARCH ---------- */

        function searchZomato() {

            let item =
                document.getElementById("search").value.trim();


            /* Check if search is empty */

            if (item === "") {

                alert("Please enter something to search.");

                return;
            }


            /* Create Zomato search URL */

            let zomatoURL =
                "https://www.zomato.com/search?q=" +
                encodeURIComponent(item);


            /* Open Zomato in new tab */

            window.open(
                zomatoURL,
                "_blank"
            );

        }


        /* ---------- ENTER KEY SEARCH ---------- */

        document
            .getElementById("search")
            .addEventListener("keydown", function (event) {

                if (event.key === "Enter") {

                    searchZomato();

                }

            });


    </script>


</body>

</html>
